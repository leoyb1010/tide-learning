name: CI

# 潮汐学习 CI：迁移、静态检查、单测、构建、安全审计与恢复演练。

on:
  push:
    branches: [master, "codex/audit-tide-learning-20261001*", "audit/five-round-product-20261004"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tide-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: "file:${{ github.workspace }}/ci.db"
      # 构建/运行时占位密钥（生产必须覆盖）。
      SESSION_SECRET: "ci-session-secret-not-for-production"
      PAY_MOCK_SECRET: "ci-mock-secret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3100"
      NEXT_PUBLIC_APP_URL: "http://localhost:3100"
      NEXT_PUBLIC_PAY_CHANNEL: "mock"
      ALLOW_LOCAL_PRODUCTION: "1"
      STORAGE_MODE: "local"
      GENERATION_WORKER_ENABLED: "0"
      NEXT_PUBLIC_CAPTURE_AUDIT: "1"
      STREAM_SIGNING_SECRET: "ci-stream-signing-secret-at-least-32-characters"

    steps:
      # v7 / v6 固定到官方仓库的不可变 commit，避免可移动 tag 改变已审计供应链。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy migrations to an empty database
        run: npm run db:deploy

      - name: Verify migration status and seed
        id: seed
        run: |
          npx prisma migrate status
          npm run db:seed

      - name: Verify upgrade from audited legacy baseline
        run: bash scripts/verify-legacy-migration.sh

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Runtime contracts and critical lifecycle flows
        run: |
          PORT=3100 npm start > "$RUNNER_TEMP/tide-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3100/api/courses >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/api/courses >/dev/null
          runtime_status=0
          run_check() { "$@" || runtime_status=1; }
          run_check env CONTRACT_BASE=http://127.0.0.1:3100 npm test -- tests/contract.test.ts tests/search.test.ts
          run_check env BASE=http://127.0.0.1:3100 bash scripts/contract-smoke.sh
          run_check env RUNTIME_BASE=http://127.0.0.1:3100 node scripts/runtime-critical.mjs
          run_check env ROLE_AUDIT_ALLOW_SYNTHETIC=1 BASE_URL=http://127.0.0.1:3100 QA_OUT="$RUNNER_TEMP/browser-qa" node scripts/audit-role-journeys.mjs
          run_check env BASE_URL=http://127.0.0.1:3100 QA_OUT="$RUNNER_TEMP/browser-qa" node tests/browser-audit.mjs
          run_check env BASE_URL=http://127.0.0.1:3100 QA_OUT="$RUNNER_TEMP/browser-qa" node scripts/audit-login-interactions.mjs
          run_check env NODE_ENV=production BASE_URL=http://127.0.0.1:3100 QA_OUT="$RUNNER_TEMP/browser-qa" node scripts/verify-browser-interactions.mjs
          run_check env PRODUCT_AUDIT_ALLOW_SYNTHETIC=1 BASE_URL=http://127.0.0.1:3100 QA_OUT="$RUNNER_TEMP/browser-qa" node scripts/audit-product-journeys.mjs
          run_check env E2E_KEEP_FIXTURE_FOR_AUDIT=1 E2E_BASE=http://127.0.0.1:3100 npm run check:embed
          run_check env PRODUCT_AUDIT_ALLOW_SYNTHETIC=1 BASE_URL=http://127.0.0.1:3100 QA_OUT="$RUNNER_TEMP/browser-qa" node scripts/audit-five-round.mjs
          exit "$runtime_status"

      - name: Preserve isolated browser audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tide-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/browser-qa/*.png
            ${{ runner.temp }}/browser-qa/*.json
            ${{ runner.temp }}/browser-qa/product-20261003/
            ${{ runner.temp }}/browser-qa/round-*/matrix.json
            ${{ runner.temp }}/tide-server.log
          if-no-files-found: warn
          retention-days: 7

      - name: Backup and restore drill
        if: ${{ always() && steps.seed.outcome == 'success' }}
        run: |
          printf '%s' 'ci-only-backup-password-32-bytes-minimum' > "$RUNNER_TEMP/backup-password"
          REQUIRE_ENCRYPTION=1 BACKUP_ENCRYPTION_PASSWORD_FILE="$RUNNER_TEMP/backup-password" \
            bash scripts/backup-db.sh "$GITHUB_WORKSPACE/ci.db" "$RUNNER_TEMP/backups"
          backup="$(find "$RUNNER_TEMP/backups" -name 'tide-*.db.enc' -type f | head -1)"
          archive="${backup%.db.enc}-uploads.tar.gz.enc"
          test -f "$backup" && test -f "$archive"
          test -z "$(find "$RUNNER_TEMP/backups" -type f ! -name '*.enc' ! -name '*.sha256' -print -quit)"
          BACKUP_ENCRYPTION_PASSWORD_FILE="$RUNNER_TEMP/backup-password" ASSETS_DIR="$RUNNER_TEMP/restored-data" \
            bash scripts/restore-db.sh "$backup" "$RUNNER_TEMP/restored.db" "$archive" --force
          test "$(sqlite3 "$RUNNER_TEMP/restored.db" 'PRAGMA integrity_check;')" = "ok"
          source_media_count="$(find "$GITHUB_WORKSPACE/.data/media" -type f | wc -l)"
          restored_media_count="$(find "$RUNNER_TEMP/restored-data/media" -type f | wc -l)"
          test "$source_media_count" -ge 4
          test "$restored_media_count" = "$source_media_count"

      - name: Dependency audit
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm audit --audit-level=low

      - name: Preserve phone-light-no-preference pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-phone-light-no-preference-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/phone-light-no-preference/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve phone-light-reduce pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-phone-light-reduce-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/phone-light-reduce/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve phone-dark-no-preference pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-phone-dark-no-preference-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/phone-dark-no-preference/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve phone-dark-reduce pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-phone-dark-reduce-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/phone-dark-reduce/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve tablet-light-no-preference pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-tablet-light-no-preference-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/tablet-light-no-preference/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve tablet-light-reduce pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-tablet-light-reduce-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/tablet-light-reduce/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve tablet-dark-no-preference pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-tablet-dark-no-preference-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/tablet-dark-no-preference/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve tablet-dark-reduce pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-tablet-dark-reduce-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/tablet-dark-reduce/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve desktop-light-no-preference pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-desktop-light-no-preference-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/desktop-light-no-preference/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve desktop-light-reduce pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-desktop-light-reduce-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/desktop-light-reduce/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve desktop-dark-no-preference pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-desktop-dark-no-preference-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/desktop-dark-no-preference/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve desktop-dark-reduce pixels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tide-desktop-dark-reduce-${{ github.sha }}
          path: ${{ runner.temp }}/browser-qa/round-*/desktop-dark-reduce/
          if-no-files-found: warn
          retention-days: 7

  native:
    name: Unsigned native builds and offline policy tests
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare Xcode project
        working-directory: ios
        run: |
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build iOS simulator without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project YoudaoStudio.xcodeproj -scheme YoudaoStudio \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/tide-ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/tide-ios-build.log"
      - name: Build macOS app without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project YoudaoStudio.xcodeproj -scheme YoudaoStudioMac \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/tide-macos" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/tide-macos-build.log"
      - name: Run offline native session-policy tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project YoudaoStudio.xcodeproj -scheme TidePolicyTests \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/tide-policy" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test | tee "$RUNNER_TEMP/tide-policy-tests.log"
      - name: Preserve native build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tide-native-${{ github.sha }}
          path: ${{ runner.temp }}/tide-*.log
          if-no-files-found: warn
          retention-days: 7
